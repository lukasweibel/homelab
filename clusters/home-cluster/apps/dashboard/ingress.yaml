apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubernetes-dashboard
  namespace: kubernetes-dashboard
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: k3s.local.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard-kong-proxy
                port:
                  number: 80
