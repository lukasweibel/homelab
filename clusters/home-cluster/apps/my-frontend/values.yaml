replicaCount: 1

image:
  repository: lukasweibel99/my-frontend
  tag: "latest@sha256:0bc00f7c0a54106d6e4d43f739cebe1126645c363cfdd73835d791ad0c3a5ae6"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: "traefik"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
  hosts:
    - host: frontend.local.lan
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi
