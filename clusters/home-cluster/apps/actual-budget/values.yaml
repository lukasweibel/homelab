replicaCount: 1

image:
  repository: actualbudget/actual-server
  tag: "latest"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 5006
  targetPort: 5006

ingress:
  enabled: true
  className: "traefik"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: actual-budget-actual-budget-headers@kubernetescrd
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
  hosts:
    - host: budget.b164.dev
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - budget.b164.dev
      secretName: budget-b164-dev-tls

persistence:
  enabled: true
  size: 1Gi
  storageClass: "longhorn-replicated"
  volumeName: pvc-53314cd0-d25a-4f63-9947-8483865917a4
  accessMode: ReadWriteOnce

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
