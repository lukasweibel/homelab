replicaCount: 0

image:
  repository: actualbudget/actual-server
  tag: "latest"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 5006
  targetPort: 5006

ingress:
  enabled: true
  className: "traefik"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: actual-budget-actual-budget-headers@kubernetescrd
  hosts:
    - host: budget.local.lan
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - budget.local.lan

persistence:
  enabled: true
  size: 1Gi
  storageClass: "longhorn-replicated"
  volumeName: pvc-53314cd0-d25a-4f63-9947-8483865917a4
  accessMode: ReadWriteOnce

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
