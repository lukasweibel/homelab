replicaCount: 1

tunnel:
  secretName: cloudflared-token-ext

automountServiceAccountToken: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

networkPolicy:
  enabled: true
  target:
    namespace: rcw-portal
    podLabels:
      app.kubernetes.io/name: rcw-portal
    port: 3000
