replicaCount: 2

image:
  repository: cloudflare/cloudflared
  tag: "2026.10.7"
  pullPolicy: Always

tunnel:
  secretName: cloudflared-token
  secretKey: token

automountServiceAccountToken: true
podSecurityContext: {}
securityContext: {}

# Egress Isolation fuer Tunnel, deren Konfiguration nicht von uns kontrolliert wird
networkPolicy:
  enabled: false
  target:
    namespace: ""
    podLabels: {}
    port: 0

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi
