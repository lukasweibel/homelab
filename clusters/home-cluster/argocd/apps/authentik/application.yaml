apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.goauthentik.io
    chart: authentik
    targetRevision: 2024.12.3
    helm:
      values: |
        authentik:
          secret_key: "changeme"
          error_reporting:
            enabled: false
          postgresql:
            password: "changeme"
            host: authentik-postgresql
            name: authentik
            user: authentik
          redis:
            host: authentik-redis

        global:
          envFrom:
            - secretRef:
                name: authentik-secrets

        postgresql:
          enabled: false

        redis:
          enabled: false

        server:
          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              traefik.ingress.kubernetes.io/router.entrypoints: websecure
              traefik.ingress.kubernetes.io/router.tls: "true"
            hosts:
              - auth.local.lan
  destination:
    server: https://kubernetes.default.svc
    namespace: authentik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
