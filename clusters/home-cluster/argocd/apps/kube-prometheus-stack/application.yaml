apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 87.21.0
    helm:
      values: |
        # k3s runs controller-manager/scheduler/etcd/kube-proxy embedded in
        # the k3s binary, not as separately scrapeable static pods like on
        # a stock kubeadm cluster - their default ServiceMonitors would just
        # sit permanently failing, so they're disabled here.
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeProxy:
          enabled: false

        prometheus:
          prometheusSpec:
            retention: 7d
            nodeSelector:
              kubernetes.io/hostname: main-node
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: longhorn-replicated
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 10Gi
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: "1"
                memory: 1Gi

        alertmanager:
          alertmanagerSpec:
            nodeSelector:
              kubernetes.io/hostname: main-node
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: longhorn-replicated
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 1Gi

        grafana:
          nodeSelector:
            kubernetes.io/hostname: main-node
          admin:
            existingSecret: grafana-admin-secret
          persistence:
            enabled: true
            storageClassName: longhorn-replicated
            size: 1Gi
          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              traefik.ingress.kubernetes.io/router.entrypoints: websecure
              traefik.ingress.kubernetes.io/router.tls: "true"
              cert-manager.io/cluster-issuer: letsencrypt-cloudflare
            hosts:
              - grafana.b164.dev
            tls:
              - hosts:
                  - grafana.b164.dev
                secretName: grafana-b164-dev-tls
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ServerSideApply=true
