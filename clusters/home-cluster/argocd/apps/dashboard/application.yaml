apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dashboard
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://kubernetes.github.io/dashboard/
      chart: kubernetes-dashboard
      targetRevision: 7.14.0
      helm:
        values: |
          kong:
            proxy:
              http:
                enabled: true
              tls:
                enabled: false
          auth:
            extraArgs:
              - --enable-insecure-login
    - repoURL: https://github.com/lukasweibel/homelab.git
      targetRevision: main
      path: clusters/home-cluster/apps/dashboard
  destination:
    server: https://kubernetes.default.svc
    namespace: kubernetes-dashboard
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true