apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dashboard
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kubernetes/dashboard.git
    path: charts/kubernetes-dashboard
    targetRevision: kubernetes-dashboard-7.14.0
    helm:
      values: |
        kong:
          proxy:
            http:
              enabled: true
        app:
          ingress:
            enabled: true
            ingressClassName: traefik
            hosts:
              - k3s.local.lan
  destination:
    server: https://kubernetes.default.svc
    namespace: kubernetes-dashboard
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true