apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.longhorn.io
    chart: longhorn
    targetRevision: 1.12.0
    helm:
      values: |
        persistence:
          defaultClass: false
        defaultSettings:
          defaultDataPath: /var/lib/longhorn
          backupTarget: s3://longhorn-b164-backup@eu-central-003/
          backupTargetCredentialSecret: longhorn-b2-backup-secret
        preUpgradeChecker:
          jobEnabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
