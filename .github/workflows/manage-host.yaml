name: Manage Hardware
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apply-rpi-01:
    runs-on: [self-hosted, rpi-01]
    steps:
      - uses: actions/checkout@v4

      - name: Hello from host
        run: |
          echo "🖥️  Hostname:    $(hostname)"
          echo "👤  User:        $(whoami)"
          echo "🏠  Home:        $HOME"
          echo "📐  Arch:        $(uname -m)"
          echo "🐧  OS:          $(cat /etc/os-release | grep PRETTY_NAME | cut -d= -f2)"